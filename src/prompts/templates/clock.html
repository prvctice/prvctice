<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clock</title>
  </head>
  <body class="p-stack pad-4 full items-center justify-center">
    <div class="p-clock-analog" id="analog" style="width: 160px; height: 160px"></div>
    <div class="p-clock-digital-lg" id="digital"></div>
    <div class="text-sm text-muted" id="date"></div>
    <script>
      prvctice.onReady(function () {
        prvctice.ui.clock(document.getElementById('digital'), {
          format: '12h',
          seconds: true,
        });

        prvctice.ui.analogClock(document.getElementById('analog'), {
          showSeconds: true,
          showNumbers: true,
          size: 160,
        });

        function updateDate() {
          var d = new Date();
          document.getElementById('date').textContent = d.toLocaleDateString(undefined, {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
          });
        }
        updateDate();
        setInterval(updateDate, 60000);
      });
    </script>
  </body>
</html>
