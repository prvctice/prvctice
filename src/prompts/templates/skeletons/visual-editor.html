<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* ── Visual Editor Skeleton ──
 * Pattern: Left toolbar + canvas viewport + right properties panel
 * Examples: Image Editor, Photo Booth, Video Studio
 */

      /* Outer wrap — 3-column layout */
      .ve-wrap {
        display: flex;
        height: 100%;
        font-family: var(--p-font-mono);
        color: var(--p-text);
      }

      /* Left toolbar */
      .ve-toolbar {
        width: 40px;
        flex-shrink: 0;
        background: var(--p-surface);
        border-right: 1px solid var(--p-border);
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px;
        overflow-y: auto;
      }
      .ve-tool-btn {
        all: unset;
        cursor: pointer;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--p-radius-sm);
        font-size: 14px;
        color: var(--p-text-muted);
        transition: all 80ms ease;
      }
      .ve-tool-btn:hover {
        background: var(--p-surface-raised);
        color: var(--p-text);
      }
      .ve-tool-btn.active {
        background: rgba(68, 136, 255, 0.12);
        color: var(--p-accent-blue);
        box-shadow: 0 0 6px rgba(68, 136, 255, 0.2);
      }
      .ve-tool-sep {
        height: 1px;
        background: var(--p-border);
        margin: 2px 4px;
      }

      /* Canvas area */
      .ve-canvas-area {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      .ve-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        background: var(--p-surface);
        border-bottom: 1px solid var(--p-border);
        flex-shrink: 0;
      }
      .ve-header-label {
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--p-text);
      }
      .ve-header-btn {
        all: unset;
        cursor: pointer;
        padding: 2px 8px;
        font-size: 9px;
        font-family: var(--p-font-mono);
        font-weight: 600;
        text-transform: uppercase;
        color: var(--p-text-muted);
        border: 1px solid var(--p-border);
        border-radius: var(--p-radius-sm);
        transition: all 80ms ease;
      }
      .ve-header-btn:hover {
        color: var(--p-text);
        background: var(--p-surface-raised);
      }
      .ve-canvas-viewport {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        background: rgba(0, 0, 0, 0.3);
      }

      /* Right properties panel */
      .ve-panel {
        width: 160px;
        flex-shrink: 0;
        background: var(--p-surface);
        border-left: 1px solid var(--p-border);
        overflow-y: auto;
        padding: 6px;
      }
      .ve-panel-section {
        margin-bottom: 8px;
      }
      .ve-panel-label {
        font-size: 8px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--p-text-muted);
        margin-bottom: 4px;
      }
      .ve-panel-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 3px;
      }
      .ve-panel-input {
        flex: 1;
        padding: 2px 4px;
        font-size: 10px;
        font-family: var(--p-font-mono);
        background: var(--p-surface-sunken);
        color: var(--p-text);
        border: 1px solid var(--p-border);
        border-radius: var(--p-radius-sm);
        outline: none;
      }
      .ve-panel-input:focus {
        border-color: var(--p-accent-blue);
      }

      /* Drop zone overlay */
      .ve-dropzone {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px dashed var(--p-border);
        border-radius: var(--p-radius-lg);
        color: var(--p-text-muted);
        font-size: 11px;
        font-family: var(--p-font-mono);
        cursor: pointer;
        transition: all 150ms ease;
      }
      .ve-dropzone:hover,
      .ve-dropzone.dragover {
        border-color: var(--p-accent-blue);
        background: rgba(68, 136, 255, 0.04);
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; height: 100vh; overflow: hidden">
    <div class="ve-wrap">
      <!-- Left toolbar -->
      <div class="ve-toolbar" id="toolbar">
        <!-- TODO: Add tool buttons -->
        <button class="ve-tool-btn active" data-tool="brush" title="Brush">B</button>
        <button class="ve-tool-btn" data-tool="eraser" title="Eraser">E</button>
        <button class="ve-tool-btn" data-tool="select" title="Select">S</button>
        <div class="ve-tool-sep"></div>
        <button class="ve-tool-btn" data-tool="crop" title="Crop">C</button>
        <button class="ve-tool-btn" data-tool="text" title="Text">T</button>
        <div class="ve-tool-sep"></div>
        <!-- Color swatch -->
        <div
          id="colorSwatch"
          style="
            width: 24px;
            height: 24px;
            border-radius: var(--p-radius-sm);
            border: 2px solid var(--p-border);
            background: #ffffff;
            cursor: pointer;
            margin: 4px auto;
          "
        ></div>
      </div>

      <!-- Canvas area -->
      <div class="ve-canvas-area">
        <div class="ve-header">
          <span class="ve-header-label" id="titleLabel"><!-- TODO: EDITOR NAME --></span>
          <span style="flex: 1"></span>
          <button class="ve-header-btn" id="undoBtn" title="Undo">UNDO</button>
          <button class="ve-header-btn" id="redoBtn" title="Redo">REDO</button>
          <button class="ve-header-btn" id="exportBtn">EXPORT</button>
        </div>
        <div class="ve-canvas-viewport" id="viewport">
          <!-- Drop zone (shown when no image loaded) -->
          <div class="ve-dropzone" id="dropZone">DROP IMAGE HERE</div>
          <!-- Canvas (hidden until image loaded) -->
          <canvas id="mainCanvas" style="display: none; cursor: crosshair"></canvas>
        </div>
      </div>

      <!-- Right panel -->
      <div class="ve-panel" id="propsPanel">
        <!-- TODO: Properties for current tool -->
        <div class="ve-panel-section">
          <div class="ve-panel-label">BRUSH</div>
          <div class="ve-panel-row">
            <span style="font-size: 8px; color: var(--p-text-muted); width: 32px">SIZE</span>
            <input class="ve-panel-input" id="brushSize" type="range" min="1" max="100" value="8" />
          </div>
          <div class="ve-panel-row">
            <span style="font-size: 8px; color: var(--p-text-muted); width: 32px">OPACITY</span>
            <input
              class="ve-panel-input"
              id="brushOpacity"
              type="range"
              min="0"
              max="100"
              value="100"
            />
          </div>
        </div>

        <div class="ve-panel-section">
          <div class="ve-panel-label">FILTERS</div>
          <!-- TODO: Add filter buttons using prvctice.image.* -->
          <button
            class="ve-header-btn"
            style="width: 100%; margin-bottom: 3px"
            data-filter="grayscale"
          >
            GRAYSCALE
          </button>
          <button class="ve-header-btn" style="width: 100%; margin-bottom: 3px" data-filter="sepia">
            SEPIA
          </button>
          <button class="ve-header-btn" style="width: 100%; margin-bottom: 3px" data-filter="blur">
            BLUR
          </button>
        </div>

        <div class="ve-panel-section">
          <div class="ve-panel-label">CANVAS</div>
          <div style="font-size: 9px; color: var(--p-text-muted)" id="canvasInfo">--</div>
        </div>
      </div>
    </div>

    <script>
      prvctice.onReady(function () {
        var canvas = document.getElementById('mainCanvas');
        var drawCtx = canvas.getContext('2d');
        var dropZone = document.getElementById('dropZone');

        // ── Undo/Redo ──
        var undoStack = [];
        var redoStack = [];
        var MAX_UNDO = 20;

        function saveState() {
          undoStack.push(drawCtx.getImageData(0, 0, canvas.width, canvas.height));
          if (undoStack.length > MAX_UNDO) undoStack.shift();
          redoStack = [];
        }

        document.getElementById('undoBtn').addEventListener('click', function () {
          if (undoStack.length === 0) return;
          redoStack.push(drawCtx.getImageData(0, 0, canvas.width, canvas.height));
          var state = undoStack.pop();
          drawCtx.putImageData(state, 0, 0);
        });

        document.getElementById('redoBtn').addEventListener('click', function () {
          if (redoStack.length === 0) return;
          undoStack.push(drawCtx.getImageData(0, 0, canvas.width, canvas.height));
          var state = redoStack.pop();
          drawCtx.putImageData(state, 0, 0);
        });

        // ── File Drop ──
        dropZone.addEventListener('dragover', function (e) {
          e.preventDefault();
          dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', function () {
          dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', function (e) {
          e.preventDefault();
          dropZone.classList.remove('dragover');
          var file = e.dataTransfer.files[0];
          if (file && file.type.startsWith('image/')) loadImage(file);
        });

        function loadImage(file) {
          var img = new Image();
          img.onload = function () {
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            drawCtx.drawImage(img, 0, 0);
            dropZone.style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('canvasInfo').textContent =
              canvas.width + ' x ' + canvas.height;
            saveState();
          };
          img.src = URL.createObjectURL(file);
        }

        // ── Tool Selection ──
        var currentTool = 'brush';
        document.getElementById('toolbar').addEventListener('click', function (e) {
          var btn = e.target.closest('[data-tool]');
          if (!btn) return;
          currentTool = btn.dataset.tool;
          var all = document.querySelectorAll('.ve-tool-btn');
          for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
          btn.classList.add('active');
        });

        // ── Filters (via prvctice.image.*) ──
        document.getElementById('propsPanel').addEventListener('click', function (e) {
          var btn = e.target.closest('[data-filter]');
          if (!btn || canvas.style.display === 'none') return;
          saveState();
          var filterName = btn.dataset.filter;
          // TODO: Apply filter using prvctice.image[filterName](canvas)
          var result = prvctice.image[filterName](canvas);
          drawCtx.clearRect(0, 0, canvas.width, canvas.height);
          drawCtx.drawImage(result, 0, 0);
        });

        // ── Drawing ──
        var drawing = false;
        canvas.addEventListener('pointerdown', function (e) {
          if (currentTool !== 'brush' && currentTool !== 'eraser') return;
          drawing = true;
          saveState();
          drawCtx.beginPath();
          var rect = canvas.getBoundingClientRect();
          var x = (e.clientX - rect.left) * (canvas.width / rect.width);
          var y = (e.clientY - rect.top) * (canvas.height / rect.height);
          drawCtx.moveTo(x, y);
        });

        canvas.addEventListener('pointermove', function (e) {
          if (!drawing) return;
          var rect = canvas.getBoundingClientRect();
          var x = (e.clientX - rect.left) * (canvas.width / rect.width);
          var y = (e.clientY - rect.top) * (canvas.height / rect.height);
          var size = parseInt(document.getElementById('brushSize').value);
          var opacity = parseInt(document.getElementById('brushOpacity').value) / 100;
          drawCtx.lineWidth = size;
          drawCtx.lineCap = 'round';
          drawCtx.globalAlpha = opacity;
          if (currentTool === 'eraser') {
            drawCtx.globalCompositeOperation = 'destination-out';
          } else {
            drawCtx.globalCompositeOperation = 'source-over';
            drawCtx.strokeStyle = document.getElementById('colorSwatch').style.background;
          }
          drawCtx.lineTo(x, y);
          drawCtx.stroke();
        });

        document.addEventListener('pointerup', function () {
          drawing = false;
          drawCtx.globalAlpha = 1;
          drawCtx.globalCompositeOperation = 'source-over';
        });

        // ── Export ──
        document.getElementById('exportBtn').addEventListener('click', function () {
          if (canvas.style.display === 'none') return;
          var dataUrl = prvctice.image.exportImage(canvas, { format: 'png' });
          var b64 = dataUrl.split(',')[1];
          prvctice.media.download(b64, 'export.png', 'image/png');
        });

        // ── Cleanup ──
        prvctice.onDispose(function () {
          undoStack = [];
          redoStack = [];
        });
      });
    </script>
  </body>
</html>
